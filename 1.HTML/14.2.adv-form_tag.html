<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Advance Form Tag</title>
  </head>
  <body>
    <h1>HTML Advance Form Tag</h1>
    <form>
      <div>
        <label for="range">Range</label>
        <input type="range" name="volume" min="0" max="100" value="0" />
      </div>
      <br>
      <div>
        <label for="birthdate"> Birthdate</label>
        <input type="date" name="birthdate" />
      </div>
      <br>
      <div>
        <label for="appointmenttime" >Appointment Time</label>
        <input type="time" name="appointmenttime">
      </div>
      <br>
      <div>
        <label for="favoritecolor" >Favorite Color</label>
        <input type="color" name="favoritecolor">
      </div>
      <br>
      <div>
        <label for="website" >Website</label>
        <input type="url" name="website">
      </div>
      <br>
      <div>
        <label for="searchquery" >searchquery</label>
        <input type="search" name="searchquery" placeholder="search...">
      </div>
      <br>
      <div>
        <label for="expirydate" >Month & Year</label>
        <input type="month" name="expirydate">
      </div>
    </form>
  </body>
</html>
