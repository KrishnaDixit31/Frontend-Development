<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>HTML Image Tag</title>
    </head>
    <body>
        <h1>Explore the New Ford Mustang</h1>
        <a href="https://www.google.com" target="_blank" > 
            <img src="images/mustang-wallpaper.jpg" alt="Image of car"
            width="100%" 
            hight="auto" 
            title="Mustang Car"
            loading="lazy">
        </a>

        <!--! This code make only some part of image clickable -->
        <img src="images/mustang-wallpaper.jpg" alt="Image of car"
            width="250" 
            hight="150" 
            title="Mustang Car"
            loading="lazy"
            usemap="#mustang">
        
        <map name="mustang">
            <area 
            shape="rect"
            coords="0,0,150,150"
            href="https://www.google.com" >
        </map>
    </body>
</html>
