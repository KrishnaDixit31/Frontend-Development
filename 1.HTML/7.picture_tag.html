<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Picture Tag</title>
    </head>
    <body>
        <h1>Welcome To The World Of Cars</h1>
        <picture>
            <!--* First choice -->
            <source srcset="images/mustang-wallpaper.webp" type="image/webp">
            
            <!--* Second choice -->
            <source srcset="images/mustang-wallpaper.jpg" type="image/jpeg">

            <!--* Fallback (always works) -->
            <img src="images/mustang-wallpaper.jpg" alt="Image of car" 
            width="500" height="auto">
        </picture>
    </body>
</html>
