<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Navigation List</title>
</head>
<body>
    <h1>HTML Navigation List</h1>

    <h2>Vertical Navigation List</h2>
    <ul style="list-style:none ">
        <li><a href="https://www.google.com" target="_blank" title="Google">Home</a></li>
        <li>About</li>
        <li>Community</li>
        <li>Contact</li>
    </ul>
    
    <hr>

    <h2>Horizontal Navigation List</h2>
    <ul style="list-style: none; display:flex ; gap:25px">
        <li><a href="https://www.google.com" target="_blank" title="Google">Home</a></li>
        <li>About</li>
        <li>Community</li>
        <li>Contact</li>
    </ul>
</body>
</html>
