<!DOCTYPE html>
<html lang="en">
<head>
    <title> HTML Nested List </title>
</head>
<body>
    <h1> HTML Nested List </h1>
    <ul>
        <li>Fruit</li>
        <ol>
            <li>Banana</li>
            <li>Apple</li>
            <ul>
                <li>Red</li>
                <li>Green</li>
            </ul>
            <li>Mango</li>
        </ol>
        <li>Vegetable</li>
        <li>Meats</li>
    </ul>
</body>
</html>
