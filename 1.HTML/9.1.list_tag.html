<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            HTML List Tag
        </title>
    </head>
    <body>
        <h1>HTML List Tag</h1>
        <ol style="list-style-type:lower-alpha"> <!--! type can be => decimal, lower-alpha, upper-alpha, lower-roman,upper-roman -->
            <li>First Class</li>
            <li>Second Class</li>
            <li>Third Class</li>
        </ol>

        <hr>
        
        <!--! we can also use type/start instead of style -->
        <ol start="A"> <!--! type can be => 1, a, A, i, I-->
            <li>First Class</li>
            <li>Second Class</li>
            <li>Third Class</li>
        </ol>

        <hr>

        <ul style="list-style-type:circle"> <!--! type can be => Disc, circle, square, none -->
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>
    </body>
</html>
