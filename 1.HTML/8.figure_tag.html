<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Figure Tag</title>
</head>
<body>
    <h1>Welcome To The World Of Cars</h1>
    <figure>
        <img src="images/mustang-wallpaper.jpg" alt="Image of Car"
        width="500" height="auto">
        <figcaption> FORT MUSTANG </figcaption>
    </figure>
</body>
</html>
