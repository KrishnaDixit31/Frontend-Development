<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Table </title>
    <style>
        table{
            text-align: center;
            border: 3px solid #000;
            border-collapse: collapse;
        }
        th, td, tr{
            border: 3px solid #000;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>HTML Table Tag</h1>
    <table>
        <thead>
            <tr>
                <th colspan="6">Time-Table</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Date</td>
                <td colspan="5">Subjects</td>
            </tr>
            <tr>
                <td>1/09/25</td>
                <td>Maths</td>
                <td>Hindi</td>
                <td rowspan="4">Lunch</td>
                <td>English</td>
                <td>Science</td>
            </tr>
            <tr>
                <td>2/09/25</td>
                <td>Hindi</td>
                <td>English</td>
                <td>Maths</td>
                <td>Science</td>
            </tr>
            <tr>
                <td>3/09/25</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Hindi</td>
                <td>English</td>
            </tr>
            <tr>
                <td>4/09/25</td>
                <td>English</td>
                <td>science</td>
                <td>Hindi</td>
                <td>Maths</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
