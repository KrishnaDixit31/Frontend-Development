<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random-Quote-Generator</title>
    <style>
        body {
            height: 100vh;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }

        div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        button {
            display: inline-block;
            width: 200px;
            height: 40px;
            background-color: rgb(102, 0, 255);
            border: 2px solid rgb(0, 200, 255);
            color: white;
            border-radius: 2rem;
        }

        h1 {
            color: rgb(98, 0, 255);
            height: 15rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="first">
        <h1>Honesty is best policy</h1>
        <button>Random Quote Generator</button>
    </div>
</body>
<script src="script.js"></script>

</html>
