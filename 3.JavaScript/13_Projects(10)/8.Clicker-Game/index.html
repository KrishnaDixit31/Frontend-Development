<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker-Game</title>
    <style>
        .circle {
            width: 5rem;
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: absolute;
            animation: grow 5s forwards;
        }

        @keyframes grow {
            0% {
                transform: scale(1);
                opacity: 1;
                font-size: 10px;
            }

            100% {
                transform: scale(3);
                opacity: 0;
                font-size: 40px;
            }
        }
    </style>
</head>

<body style="background-color: black; color: black; height: 100vh; position: relative;">

</body>
<script src="script.js"></script>

</html>
