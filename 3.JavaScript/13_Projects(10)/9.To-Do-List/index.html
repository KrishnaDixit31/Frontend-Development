<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <style>
        body {
            background-color: #222;
            color: rgb(102, 0, 255);
            height: 100vh;
            display: flex;
            flex-direction: column;
            text-align: center;
            font-size: 2rem;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 0.5rem;
        }

        input {
            margin-right: 2rem;
            height: 50px;
            outline: none;
            border: none;
            font-size: 1.5rem;
            padding-inline: 1rem;
            border-radius: 2rem;
        }

        button[type='submit'] {
            display: inline-block;
            width: 100px;
            height: 50px;
            font-size: 1.5rem;
            background-color: rgb(102, 0, 255);
            border: 2px solid rgb(250, 252, 253);
            color: white;
            border-radius: 2rem;
            margin: 2rem auto;
        }

        button {
            display: inline-block;
            height: 50px;
            font-size: 1.5rem;
            background-color: rgb(102, 0, 255);
            border: 2px solid rgb(250, 252, 253);
            color: white;
            border-radius: 2rem;
            margin: 2rem auto;
        }
    </style>
</head>

<body>
    <h1>TO DO LIST</h1>
    <form>
        <input type="text" name="task" id="task" required>
        <button type="submit">Add</button>
    </form>
    <div id="alltask"></div>
</body>
<script src="script.js"></script>

</html>
