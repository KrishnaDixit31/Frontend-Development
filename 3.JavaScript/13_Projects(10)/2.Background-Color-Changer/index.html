<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background-Color-Changer</title>
    <style>
        button {
            display: inline-block;
            width: 200px;
            height: 40px;
            border: 2px solid #222;
            color: white;
            border-radius: 2rem;
            margin-bottom: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Choose Background Color</h1>
    <div id="parent">
        <button id="red" style="background-color: red;">Red</button>
        <button id="orange" style="background-color: orange;">orange</button>
        <button id="burlywood" style="background-color: burlywood;">burlywood</button>
        <button id="palevioletred" style="background-color: palevioletred">palevioletred</button>
        <button id="gray" style="background-color: gray;">gray</button>
    </div>
</body>
<script src="script.js"></script>
</html>
