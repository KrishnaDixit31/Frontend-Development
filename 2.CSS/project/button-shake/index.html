<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shake button</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
            background-color: #191825;
        }
        button{
            padding: 12px 36px;
            border: 5px solid #865dff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-transform: capitalize;
            background-color: transparent;
            color: #865dff;
            border-radius: 10px;

            &:hover{
                border: 5px solid #d80032;
                color: #d80032;
                animation: shaking 0.2s linear ;
            }
        }
        @keyframes shaking {
            0%{
                rotate: 20deg;
            }
            50%{
                rotate: -20deg;
            }
            100%{
                rotate: 20deg;
            }
        }
    </style>
</head>
<body>
    <button type="button">Shake Me</button>
</body>
</html>
