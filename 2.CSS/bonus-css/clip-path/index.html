<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clippath in css</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100vh;
            background-color: hsl(0,0,91%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }
        img{
            width: 30%;
            border-radius: 10px;
            clip-path: polygon(0% 0%, 0% 100%, 100% 0%);
        }
    </style>
</head>
<body>
    <h1>CSS CLIP PATH</h1>
    <img src="/HTML +CSS/images/html.png" alt="html thumbnail">
</body>
</html>
