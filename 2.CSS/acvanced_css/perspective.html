<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>perspective in css</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;600&family=Quicksand:wght@300;400;500;600;700&family=Urbanist:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Urbanist", sans-serif;
      }
      body {
        background-color: #2b3033;
      }
      .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        box-shadow: inset 0 0 0 5px #4861ec;
        perspective: 1000px;
      }
      .box {
        width: 500px;
        height: auto;
        background-color: #4861ec;
        box-shadow: 0 0 0px 15px #353f6d;
        transition: all 1s linear;
      }
      .box:hover{
        transform: rotateX(45deg);
        /* transform: translateZ(200px); */
        /* transform: scale(2); */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="box" src="/HTML +CSS/images/html.png" alt="HTML thumbnail" />
    </div>
  </body>
</html>
