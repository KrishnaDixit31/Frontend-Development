<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animation in css</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.3),
            rgba(0, 0, 0, 0.1)
          ),
          url("/HTML +CSS/images/mario-bg.png");
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      img {
        width: 200px;
        position: absolute;                       
        bottom: 8.5%;
        animation: mariorun 2s linear alternate 1s 2 ;
        /* animation-iteration-count: 2; */
      }
      @keyframes mariorun{
        0%{
            translate: 0%;
        }
        100%{
            translate: calc(100vw - 200px);
        }
      }
    </style>
  </head>
  <body>
    <img src="/HTML +CSS/images/mario-run.gif" alt="mario-running" />
  </body>
</html>
