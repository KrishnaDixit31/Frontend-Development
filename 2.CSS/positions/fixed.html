<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positions-fixed in CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        font-family: "Oswald", sans-serif;
      }
      .main-section{
        width: 100%;
        background-color: blue;
        color: #fff;
        display: block;
        text-align: center;
        padding: 10px;
        box-shadow: 0px 2px 2px rgb(43, 60, 107);

        position: fixed;
        top: 0;
      }
      #main-heading{
        font-size: 2.2rem;
        margin: 1rem 0;
      }
      .section-full{
        width: 100%;
        height: 100vh;
        color: #fff;
        font-size: 52px;
        background-image: linear-gradient(to right, rgb(0, 98, 255) ,rgb(33, 182, 145));
      }

      .section-full a{
        padding: 16px 32px;
        color: #0352ee;
        background-color: #fff;
        border-radius: 3px;
        font-size: 24px;
        display: inline-block;
        position: sticky;
        top:50%;
      }
      
    </style>
  </head>
  <body>
    <div class="main-section">
      <h1 id="main-heading">CSS Positions-Fixed</h1>
    </div>
    <div class="section-full"></div>
    <br>
    <div class="section-full"><a href="#">Join Whatsapp Now</a></div>
    <br>
    <div class="section-full"></div>
    <br>
    <div class="section-full"></div>
  </body>
</html>
