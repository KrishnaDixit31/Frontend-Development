<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container Queries</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "urbanist";
      }
      body {
        height: 100vh;
        background-color: #191717;
      }

      .container,
      .media {
        max-width: 800px;
        height: auto;
        border: 5px solid #ffb000;
        margin-right: 200px;

        & div {
          display: grid;
          align-items: center;
          grid-template-columns: 1fr 0.5fr;
        }
      }

      .container {
        container-type: inline-size;
        container-name: changelayout;
      }

      h1 {
        text-align: center;
        color: #fff;
        font-weight: bold;
        text-transform: capitalize;
        text-shadow: -3px 10px 10px rgba(249, 141, 141, 0.2);
        animation: floating 2s linear infinite alternate;
      }

      img {
        width: 80%;
        height: auto;
      }

      @container changelayout (width <= 600px) {
        .container div {
          grid-template-columns: 1fr;
        }
        h1 {
          color: #ffb000;
          text-transform: uppercase;
          padding: 20px 0;
        }
      }

      @media (width <= 600px) {
        .media div {
          grid-template-columns: 1fr;
        }

        h1 {
          color: #ffb000;
          text-transform: uppercase;
          padding: 20px 0;
        }
      }
    </style>
  </head>
  <body>
    <br />
    <br />

    <div class="container">
      <div>
        <img src="/HTML +CSS/images/html.png" alt="html thumbnail" />
        <h1>new css feature container queries..</h1>
      </div>
    </div>

    <br />
    <br />

    <div class="media">
      <div>
        <img src="/HTML +CSS/images/html.png" alt="html thumbnail" />
        <h1>new css feature container queries..</h1>
      </div>
    </div>
  </body>
</html>
